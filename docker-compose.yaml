services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes: [mongo-data:/data/db]
  mongo-express:
    image: mongo-express
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongo:27017/
    depends_on: [mongo]
  app:
    build: ./app
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://admin:password@mongo:27017/company?authSource=admin
    depends_on: [mongo]
volumes:
  mongo-data: