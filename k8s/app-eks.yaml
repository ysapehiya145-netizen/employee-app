apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
  namespace: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3000"
        k8s.grafana.com/metrics.path: "/metrics"
    spec:
      containers:
        - name: employee-app
          image: __IMAGE__
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: employee-app-db
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: employee-app-service
  namespace: employee-app
spec:
  type: ClusterIP
  selector:
    app: employee-app
  ports:
    - port: 3000
      targetPort: 3000
