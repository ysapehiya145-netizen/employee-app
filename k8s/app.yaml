apiVersion: apps/v1
kind: Deployment
metadata: { name: employee-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: employee-app } }
  template:
    metadata:
      labels: { app: employee-app }
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3000"
        k8s.grafana.com/metrics.path: "/metrics"
    spec:
      containers:
        - name: employee-app
          image: yogeshsapehiya/employee-app:v1
          ports: [{ containerPort: 3000 }]
          env:
            - name: MONGO_URL
              value: mongodb://admin:password@mongo-service:27017/company?authSource=admin
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata: { name: employee-app-service }
spec:
  type: NodePort
  selector: { app: employee-app }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30030 }]