apiVersion: v1
kind: Secret
metadata: { name: mongo-secret }
type: Opaque
stringData:
  username: admin
  password: password
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mongo-secret, key: username } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-secret, key: password } }
---
apiVersion: v1
kind: Service
metadata: { name: mongo-service }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]